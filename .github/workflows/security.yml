name: Security

on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/FUNDING.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "SECURITY.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - ".github/FUNDING.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "SECURITY.md"
      - "docs/**"
  schedule:
    # Run every Monday at 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  bandit:
    name: Bandit (Python Security Linting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit[toml]"

      - name: Run Bandit
        id: bandit
        continue-on-error: true
        # -r walks the named directories; new examples are picked up automatically.
        # Cache and build directories are excluded explicitly because Bandit does
        # not skip them by default.
        run: |
          bandit -r vector_passport.py validate_passport.py implementations examples \
            --exclude __pycache__,.ruff_cache,.git,.venv \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-results.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('bandit-results.json') != ''
        with:
          name: bandit-results
          path: bandit-results.json

      - name: Fail on Bandit findings
        if: steps.bandit.outcome == 'failure'
        run: exit 1

  pip-audit:
    name: pip-audit (Dependency Vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        id: pip-audit
        continue-on-error: true
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-results.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('pip-audit-results.json') != ''
        with:
          name: pip-audit-results
          path: pip-audit-results.json

      - name: Fail on pip-audit findings
        if: steps.pip-audit.outcome == 'failure'
        run: exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
